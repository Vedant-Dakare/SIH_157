[project]
name = "satsa"
version = "0.1.0"
description = "SOC Alert Triage & Security Analytics — air-gapped SOC analytics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
lite = [
  "typer>=0.12",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "structlog>=24.1",
  "rich>=13.7",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "duckdb>=0.10",
  "python-dateutil>=2.9",
  "scikit-learn>=1.4",
]
full = [
  "satsa[lite]",
  "sentence-transformers>=2.7",
  "weasyprint>=60.0",
]
ai = [
  "satsa[full]",
  "llama-cpp-python>=0.2",
  "ollama>=0.2",
]

[project.scripts]
satsa = "satsa.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["server/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
ignore_missing_imports = true
python_version = "3.13"
explicit_package_bases = true
mypy_path = "server/src"
